services:
  - type: web
    name: finnexus-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn Backend.main:app -k uvicorn.workers.UvicornWorker -w 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: ENV
        value: production
      - key: PORT
        value: 8000
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.6
      # Add other required vars from .env.example:
      # - key: LLM_PROVIDER
      #   value: groq
      # - key: LLM_API_KEY
      #   sync: false
      # - key: LLM_MODEL
      #   value: gemma2-9b-it
      # - key: CORS_ORIGINS
      #   value: https://your-vercel-app.vercel.app
